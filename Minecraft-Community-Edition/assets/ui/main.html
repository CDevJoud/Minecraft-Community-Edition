<rml>
	<head>
		<style>
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;
				font: arial_black;
			}

			.hud {
				/* responsive sizing */
				width: 100%;
				min-width: 260px;
				max-width: 500px;
				/* top middle positioning */
				margin-left: auto;
				margin-right: auto;
				margin-top: 30%;
				padding: 1.2%;
				background-color: #1a1a1a;
				border: 2px solid #c8a060;
				border-radius: 12px;
			}

			.title {
				font-size: 22px;
				color: #ffffff;
				margin-bottom: 8px;
				letter-spacing: 1px;
			}

			.subtitle {
				font-size: 14px;
				color: #888888;
				margin-bottom: 10px;
			}

			.divider {
				height: 1px;
				background-color: #333333;
				margin-top: 8px;
				margin-bottom: 8px;
			}

			.line {
				font-size: 16px;
				color: #cccccc;
				margin-top: 6px;
			}

			.status {
				font-size: 16px;
				color: #c8a060;
				margin-top: 10px;
			}
		</style>
	</head>

	<body>
		<div class="hud">
			<div class="title">DAMASCENE ENGINE</div>

			<div class="subtitle">
				runtime interface
			</div>

			<div class="divider"></div>

			<div class="line">
				Welcome to the engine interface
			</div>

			<div class="status">
				● Online
			</div>
		</div>
	</body>
</rml>
